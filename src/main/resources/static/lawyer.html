<!DOCTYPE html>
<html lang="uz" data-theme="light">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Lawyer Portal - MAXLEGAL</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6" id="loginCard">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h4 class="card-title">Advokat kirishi</h4>
                    <form id="loginForm">
                        <div class="mb-3">
                            <label for="loginEmail" class="form-label">Email</label>
                            <input type="email" class="form-control" id="loginEmail" required>
                        </div>
                        <div class="mb-3">
                            <label for="loginPassword" class="form-label">Parol</label>
                            <input type="password" class="form-control" id="loginPassword" required>
                        </div>
                        <button class="btn btn-primary w-100" id="loginBtn" type="submit">Kirish</button>
                        <div class="alert alert-danger mt-3 d-none" id="loginError"></div>
                    </form>
                </div>
            </div>
        </div>

        <div class="col-12 d-none" id="dashboard">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h3>Men uchun berilgan arizalar</h3>
                <div>
                    <button class="btn btn-outline-secondary me-2" id="logoutBtn">Chiqish</button>
                    <span class="badge bg-secondary" id="lawyerEmail"></span>
                </div>
            </div>

            <div id="messagesList" class="list-group"></div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<script src="/js/lawyer.js"></script>
</body>
</html>
