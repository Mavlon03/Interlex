# Security Configuration
# For local development disable SSL by default. Set to true and provide keystore in production.
spring.security.require-ssl=false
server.ssl.enabled=false
# server.ssl.key-store=classpath:keystore.p12
# server.ssl.key-store-password=changeit
# server.ssl.key-store-type=PKCS12
# server.ssl.key-alias=interlex

# JWT Configuration
# jwt.secret va app.encryption.key bu yerda saqlanmaydi: lokalda application-local.properties, prod'da JWT_SECRET / APP_ENCRYPTION_KEY muhit o'zgaruvchilari
jwt.expiration=86400

# Encryption Configuration

# Rate Limiting
app.rate-limit.contact.requests-per-minute=5
app.rate-limit.general.requests-per-minute=100

# Security Headers
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict

# Database Security
spring.jpa.properties.hibernate.connection.provider_disables_autocommit=true
spring.jpa.properties.hibernate.query.fail_on_pagination_over_collection_fetch=true
spring.jpa.properties.hibernate.query.in_clause_parameter_padding=true

# Logging Security Events
logging.level.uz.pdp.interlex.security=WARN
logging.level.org.springframework.security=WARN

# Admin Configuration
app.admin.email=mamatmurodovfirdavs@gmail.com
app.admin.max-login-attempts=3
app.admin.lockout-duration-minutes=30

# Content Security Policy
app.security.csp=default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' fonts.googleapis.com; font-src 'self' fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self'
