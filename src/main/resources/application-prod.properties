# Production profile (SPRING_PROFILES_ACTIVE=prod)
# Sirlar bu faylda EMAS, muhit o'zgaruvchilarida beriladi (deploy/interlex.env.example):
#   SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD,
#   SPRING_MAIL_USERNAME, SPRING_MAIL_PASSWORD, JWT_SECRET, APP_ENCRYPTION_KEY, APP_ADMIN_EMAIL

# Faqat nginx orqali kirish mumkin
server.address=127.0.0.1
server.port=8080

# nginx (HTTPS terminatsiya) ortida: X-Forwarded-* sarlavhalariga ishonish
server.forward-headers-strategy=framework

# Domen
app.cors.allowed-origins=https://maxlegal.uz,https://www.maxlegal.uz

# Baza: prod'da sxemani Hibernate o'zgartirmasin, faqat tekshirsin
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Swagger prod'da yopiq
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# Loglar
logging.level.uz.pdp.interlex=INFO
logging.level.org.springframework.mail=WARN
